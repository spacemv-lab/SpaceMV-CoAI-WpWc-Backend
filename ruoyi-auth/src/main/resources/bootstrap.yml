# Tomcat
server:
  port: 9200

# Spring
spring:
  application:
    # 应用名称
    name: ruoyi-auth
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: ${NACOS_SERVER_ADDR:-nacos-server:8848}
        namespace: ${NACOS_NAMESPACE:-public}
      config:
        # 配置中心地址
        server-addr: ${NACOS_SERVER_ADDR:-nacos-server:8848}
        namespace: ${NACOS_NAMESPACE:-public}
    
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
