# Tomcat
server:
  port: 9205

# Spring
spring:
  application:
    name: txwx-social-crm
  cloud:
    nacos:
      discovery:
        enabled: false
        register-enabled: false
      config:
        enabled: false
  datasource:
    dynamic:
      primary: mysql
      strict: false
      datasource:
        mysql:
          url: jdbc:mysql://YOUR_DB_HOST:3306/ry-cloud2?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
          username: YOUR_DB_USER
          password: YOUR_DB_PASSWORD
          driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: YOUR_REDIS_HOST
    port: 6379
    password: YOUR_REDIS_PASSWORD

txwx:
  sms:
    aliyun:
      ALIBABA_CLOUD_ACCESS_KEY_ID: YOUR_ALIYUN_SMS_ACCESS_KEY_ID
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: YOUR_ALIYUN_SMS_ACCESS_KEY_SECRET
      endpoint: dysmsapi.aliyuncs.com
      region-id: cn-hangzhou
      sign-name: YOUR_SMS_SIGN_NAME
      template:
        verification-code: YOUR_SMS_TEMPLATE_CODE
        notification: YOUR_SMS_NOTIFICATION_TEMPLATE
      template-code:
  email:
    host: smtp.huaweicloud.com
    port: 465
    username: YOUR_SMTP_USERNAME
    password: YOUR_SMTP_PASSWORD
    from-alias: YOUR_FROM_ALIAS
    subject: 验证码
    content-template: 您的验证码是：{code}
  verify:
    code-expire-minutes: 5
    limit-expire-seconds: 60
    redis-key-prefix:
      sms-code: "txwx:verify:sms:code:"
      email-code: "txwx:verify:email:code:"
      limit: "txwx:verify:limit:"

verify:
  limit-expire-seconds: 60

code-expire-minutes: 5
