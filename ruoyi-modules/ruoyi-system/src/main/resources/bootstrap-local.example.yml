# Tomcat
server:
  port: 9201

# Spring
spring:
  application:
    name: ruoyi-system
  cloud:
    nacos:
      discovery:
        enabled: false
        register-enabled: false
      config:
        enabled: false
  datasource:
    dynamic:
      primary: mysql
      strict: false
      datasource:
        mysql:
          url: jdbc:mysql://YOUR_DB_HOST:3306/ry-cloud2?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
          username: YOUR_DB_USER
          password: YOUR_DB_PASSWORD
          driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: YOUR_REDIS_HOST
    port: 6379
    password: YOUR_REDIS_PASSWORD

mybatis:
  mapperLocations: classpath*:mapper/**/*.xml
  typeAliasesPackage: com.ruoyi.system.domain,com.ruoyi.system.api.domain
  configuration:
    mapUnderscoreToCamelCase: true
    logImpl: org.apache.ibatis.logging.stdout.StdOutImpl
