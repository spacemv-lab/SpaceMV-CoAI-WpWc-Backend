spring.datasource.platform=mysql
db.num=1
db.url.0=jdbc:mysql://txwx-mysql:3306/txwx?characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=UTC
db.user=${MYSQL_USER:-root}
db.password=${MYSQL_PASSWORD:}

nacos.naming.empty-service.auto-clean=true
nacos.naming.empty-service.clean.initial-delay-ms=50000
nacos.naming.empty-service.clean.period-time-ms=30000

# 仅暴露健康检查和 Prometheus 指标端点，按需扩展
management.endpoints.web.exposure.include=health,prometheus

management.metrics.export.elastic.enabled=false
management.metrics.export.influx.enabled=false

server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D %{User-Agent}i %{Request-Source}i

server.tomcat.basedir=/home/ruoyi/nacos/tomcat/logs

nacos.security.ignore.urls=/,/error,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.ico,/console-ui/public/**,/v1/auth/**,/v1/console/health/**,/actuator/**,/v1/console/server/**

nacos.core.auth.system.type=nacos
nacos.core.auth.enabled=true
nacos.core.auth.default.token.expire.seconds=18000
# 注意：部署前必须通过环境变量配置以下密钥！
# 可在 docker-compose.yml 的 environment 段中设置，示例：
#   NACOS_AUTH_TOKEN_SECRET_KEY=Base64Encode(YourSecretKey)
#   NACOS_AUTH_SERVER_IDENTITY_KEY=your-custom-identity-key
#   NACOS_AUTH_SERVER_IDENTITY_VALUE=your-custom-identity-value
nacos.core.auth.default.token.secret.key=${NACOS_AUTH_TOKEN_SECRET_KEY:}
nacos.core.auth.caching.enabled=true
nacos.core.auth.enable.userAgentAuthWhite=false
nacos.core.auth.server.identity.key=${NACOS_AUTH_SERVER_IDENTITY_KEY:-your-custom-identity-key}
nacos.core.auth.server.identity.value=${NACOS_AUTH_SERVER_IDENTITY_VALUE:-your-custom-identity-value}

nacos.istio.mcp.server.enabled=false
