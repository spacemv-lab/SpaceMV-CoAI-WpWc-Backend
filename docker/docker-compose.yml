version : '3.8'
services:
  txwx-nacos:
    container_name: txwx-nacos
    image: txwx-nacos
    build:
      context: ./nacos
    environment:
      - MODE=standalone
      # ⚠️ 安全配置：部署前必须设置以下密钥！
      # NACOS_AUTH_TOKEN_SECRET_KEY=Base64编码的32字节密钥（生成：openssl rand -base64 32）
      # NACOS_AUTH_SERVER_IDENTITY_KEY=your-custom-identity-key
      # NACOS_AUTH_SERVER_IDENTITY_VALUE=your-custom-identity-value
    volumes:
      - ./nacos/logs/:/home/nacos/logs
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      - txwx-mysql
  txwx-mysql:
    container_name: txwx-mysql
    image: txwx-mysql
    build:
      context: ./mysql
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/logs:/logs
      - ./mysql/data:/var/lib/mysql
    command: [
          'mysqld',
          '--innodb-buffer-pool-size=80M',
          '--character-set-server=utf8mb4',
          '--collation-server=utf8mb4_unicode_ci',
          '--default-time-zone=+8:00',
          '--lower-case-table-names=1'
        ]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-spacemv}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-your_root_password}
  txwx-redis:
    container_name: ${REDIS_CONTAINER_NAME:-txwx-redis}
    image: ${REDIS_IMAGE_NAME:-txwx-redis}
    build:
      context: ./redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/conf/redis.conf:/home/ruoyi/redis/redis.conf
      - ./redis/data:/data
    command: redis-server /home/ruoyi/redis/redis.conf
  txwx-nginx:
    container_name: txwx-nginx
    image: txwx-nginx
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/html/dist:/home/ruoyi/projects/ruoyi-ui
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - ruoyi-gateway
    links:
      - ruoyi-gateway
  ruoyi-gateway:
    container_name: ruoyi-gateway
    build:
      context: ./ruoyi/gateway
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - txwx-redis
    links:
      - txwx-redis
  ruoyi-auth:
    container_name: ruoyi-auth
    build:
      context: ./ruoyi/auth
      dockerfile: dockerfile
    ports:
      - "9200:9200"
    depends_on:
      - txwx-redis
    links:
      - txwx-redis
  ruoyi-modules-system:
    container_name: ruoyi-modules-system
    build:
      context: ./ruoyi/modules/system
      dockerfile: dockerfile
    ports:
      - "9201:9201"
    depends_on:
      - txwx-redis
      - txwx-mysql
    links:
      - txwx-redis
      - txwx-mysql
  ruoyi-modules-gen:
    container_name: ruoyi-modules-gen
    build:
      context: ./ruoyi/modules/gen
      dockerfile: dockerfile
    ports:
      - "9202:9202"
    depends_on:
      - txwx-mysql
    links:
      - txwx-mysql
  ruoyi-modules-job:
    container_name: ruoyi-modules-job
    build:
      context: ./ruoyi/modules/job
      dockerfile: dockerfile
    ports:
      - "9203:9203"
    depends_on:
      - txwx-mysql
    links:
      - txwx-mysql
  ruoyi-modules-file:
    container_name: ruoyi-modules-file
    build:
      context: ./ruoyi/modules/file
      dockerfile: dockerfile
    ports:
      - "9300:9300"
    volumes:
    - ./ruoyi/uploadPath:/home/ruoyi/uploadPath
  ruoyi-visual-monitor:
    container_name: ruoyi-visual-monitor
    build:
      context: ./ruoyi/visual/monitor
      dockerfile: dockerfile
    ports:
      - "9100:9100"
  txwx-website:
    container_name: txwx-website
    build:
      context: ./ruoyi/modules/txwx-website
      dockerfile: dockerfile
    ports:
      - "9203:9203"
    depends_on:
      - txwx-redis
      - txwx-mysql
    links:
      - txwx-redis
      - txwx-mysql
  txwx-social-crm:
    container_name: txwx-social-crm
    build:
      context: ./ruoyi/modules/txwx-social-crm
      dockerfile: dockerfile
    ports:
      - "9205:9205"
    depends_on:
      - txwx-redis
      - txwx-mysql
    links:
      - txwx-redis
      - txwx-mysql
